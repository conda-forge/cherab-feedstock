context:
  version: "1.6.0"

package:
  name: cherab
  version: ${{ version }}

source:
  url: https://github.com/cherab/core/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ae20c3f2c32602e4c347fc8e80a3d7ce9000e6467af2f940cd562141604f7d38

build:
  script: ${{ PYTHON }} -m pip install --no-build-isolation --no-deps -vv .
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
        - numpy
        - raysect 0.9.*
  host:
    - python
    - pip
    - setuptools
    - cython
    - numpy
    - raysect 0.9.*
  run:
    - python
    - scipy
    - matplotlib-base
  run_exports:
    - ${{ pin_subpackage("cherab", upper_bound="x.x") }}

tests:
  - python:
      imports:
        - cherab
        - cherab.core
        - cherab.generomak
        - cherab.openadas
        - cherab.tools
      pip_check: true

  - script:
      - if: unix
        then:
          - python -c "import cherab; print(cherab.__path__[0])" | xargs python -m unittest discover -v -s
      - if: win
        then:
          - python -c "import cherab; print(cherab.__path__[0])" | python -m unittest discover -v -s ?

about:
  homepage: https://www.cherab.info/
  summary: Cherab spectroscopy framework
  license: EUPL-1.1
  license_file: LICENCE.txt
  documentation: https://cherab.github.io/documentation/
  repository: https://github.com/cherab/core.git

extra:
  recipe-maintainers:
    - munechika-koyo
